<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Transporte Fácil</title>

<link
    rel="stylesheet"
    href="css/tela_principal.css"
>


<div class="dashboard">

    <!-- =====================================
         CABEÇALHO
    ====================================== -->

    <header class="cabecalho">

        <button
            id="btnVoltar"
            class="btn-voltar"
            type="button"
            aria-label="Voltar"
        >
            ←
        </button>


        <h1>
            Transporte Fácil
        </h1>


        <button
            id="btnMenu"
            class="btn-menu"
            type="button"
            aria-label="Abrir menu"
        >
            ☰
        </button>


        <!-- MENU -->

        <div
            id="menuDropdown"
            class="menu-dropdown"
        >

            <button
                class="item-menu"
                data-acao="login"
                type="button"
            >
                <span class="icone-menu">🔐</span>
                Login
            </button>


            <button
                class="item-menu"
                data-acao="favoritos"
                type="button"
            >
                <span class="icone-menu">♡</span>
                Favoritos
            </button>


            <button
                class="item-menu"
                data-acao="compartilhar"
                type="button"
            >
                <span class="icone-menu">↗</span>
                Compartilhar
            </button>


            <button
                class="item-menu"
                data-acao="configuracoes"
                type="button"
            >
                <span class="icone-menu">⚙</span>
                Configurações
            </button>


            <button
                class="item-menu sair"
                data-acao="sair"
                type="button"
            >
                <span class="icone-menu">↪</span>
                Sair
            </button>

        </div>

    </header>


    <!-- =====================================
         CONTEÚDO
    ====================================== -->

    <main class="conteudo">

        <!-- TÍTULO -->

        <section class="titulo-secao">

            <h2>
                Linhas disponíveis
            </h2>

            <p>
                Encontre sua rota e consulte os horários.
            </p>

        </section>


        <!-- =================================
             BUSCA
        ================================== -->

        <div class="area-busca">

            <span class="icone-busca">
                🔎
            </span>


            <input
                type="text"
                id="campoBusca"
                placeholder="Buscar linha ou destino..."
                autocomplete="off"
            >


            <button
                id="btnLimpar"
                class="btn-limpar"
                type="button"
                aria-label="Limpar busca"
            >
                ×
            </button>

        </div>


        <!-- =================================
             LISTA DE ROTAS
        ================================== -->

        <section class="cabecalho-resultados">

            <h3>
                Rotas
            </h3>


            <span id="contadorLinhas">
                Carregando...
            </span>

        </section>


        <!-- =================================
             ROTAS VINDAS DO POSTGRESQL
        ================================== -->

        <div
            id="listaLinhas"
            class="lista-linhas"
        >

            <!--
                As rotas cadastradas no PostgreSQL
                serão inseridas aqui pelo JavaScript.
            -->

        </div>


        <!-- =================================
             SEM RESULTADOS
        ================================== -->

        <div
            id="semResultados"
            class="sem-resultados"
        >

            <span>
                🔎
            </span>


            <h3>
                Nenhuma rota encontrada
            </h3>


            <p>
                Tente buscar por outro nome ou destino.
            </p>

        </div>

    </main>

</div>


<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="js/tela_principal.js"></script>
