<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Transporte Fácil</title>

    <link
        rel="stylesheet"
        href="css/tela_inicial.css"
    >

</head>


<body>

    <main class="tela-inicial">

        <!-- =====================================
             FUNDO
        ====================================== -->

        <div class="overlay"></div>


        <!-- =====================================
             CONTEÚDO PRINCIPAL
        ====================================== -->

        <div class="conteudo">

            <section class="logo">

                <div class="nome-aplicativo">

                    <span class="transporte">
                        Transporte
                    </span>

                    <span class="facil">
                        Fácil
                    </span>

                </div>

            </section>

        </div>


        <!-- =====================================
             ÁREA DO BOTÃO
        ====================================== -->

        <div class="area-botao">

            <button
                id="btnEntrar"
                class="btn-entrar"
                type="button"
            >

                <span>
                    Entrar
                </span>

                <span class="seta">
                    →
                </span>

            </button>


            <!-- =================================
                 FRASE
            ================================== -->

            <p class="subtitulo">
                Seu Caminho Mais Acessível
            </p>

        </div>

    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/tela_inicial.js"></script>

    <footer class="rodape">
    Criado e desenvolvido por <strong>Devs Tech</strong>
</footer>

</body>

</html>
